<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Traceability</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>SQL Traceability</h1>
        <form id="trace-form">
            <textarea id="sql-script" name="sql_script" rows="10" cols="50" placeholder="Enter your SQL script here..."></textarea>
            <button type="submit">Generate Traceability</button>
        </form>
        <div id="trace-result"></div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
